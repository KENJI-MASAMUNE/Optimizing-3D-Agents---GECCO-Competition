name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -q
        # Note: scripts/run_phase1.py --smoke is intentionally NOT run here -- it requires
        # a real Framsticks/framspy install (licensed binary, can't be installed via pip or
        # apt), which CI doesn't have. `pytest` above already covers engine.py's algorithm
        # logic via tests/fakes.py's test-only double.
